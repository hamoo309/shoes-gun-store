name: shoes-gun
x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?Set the runtime application DATABASE_URL in a private environment file}
  SESSION_SECRET: ${SESSION_SECRET:?Preserve the existing stable SESSION_SECRET}
  APP_SECRET: ${APP_SECRET:-}
  NODE_ENV: production
  STORAGE_DIR: /app/storage
  HOST: 0.0.0.0
  PORT: "4000"
  WEB_ORIGIN: ${NEXT_PUBLIC_SITE_URL:?Set the canonical HTTPS origin}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical HTTPS origin}
  COOKIE_SECURE: "true"
  LOGIN_RATE_LIMIT_STORE: postgres
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.15-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoes_gun}
      POSTGRES_USER: ${POSTGRES_USER:-shoesgun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [store]
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-shoes-gun-api:local}
    environment:
      <<: *api-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the separate migration-owner target DATABASE_URL}
    command: ["npm", "run", "db:migrate", "--workspace", "@shoes-gun/api"]
    depends_on:
      db: {condition: service_healthy}
    networks: [store]
    restart: "no"
    # Explicit operator step; ordinary up/restart never migrates a database.
    profiles: [maintenance]
  api:
    image: ${API_IMAGE:-shoes-gun-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    # Restored media is authoritative; startup never seeds or copies images.
    command: ["node", "apps/api/dist/server.js"]
    volumes:
      - media_data:/app/storage
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    networks: [store]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical HTTPS origin}
    image: ${WEB_IMAGE:-shoes-gun-web:local}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical HTTPS origin}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [store]
volumes:
  postgres_data:
  media_data:
networks:
  store:
