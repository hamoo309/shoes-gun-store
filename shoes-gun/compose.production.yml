services:
  api:
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set the final domain in .env.docker}
      ACME_EMAIL: ${ACME_EMAIL:?Set the TLS certificate contact email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [store]
volumes:
  caddy_data:
  caddy_config:
