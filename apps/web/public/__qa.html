<!doctype html><html lang="en"><meta charset="utf-8"><title>SHOES GUN responsive QA</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e8e8;font:14px Arial}header{height:52px;padding:10px 16px;background:#151515;color:white;display:flex;gap:10px;align-items:center}button{padding:7px;border:0;cursor:pointer}button.active{background:#ed242c;color:white}.stage{margin:12px auto;overflow:hidden}iframe{display:block;border:0;transform-origin:top left;background:white}</style><header><strong>SHOES GUN / QA</strong><button onclick="choose(390,950,this)">Mobile 390</button><button onclick="choose(768,1024,this)">Tablet 768</button><button onclick="choose(1440,1000,this)">Desktop 1440</button><select onchange="frame.src=this.value"><option value="/">Storefront</option><option value="/products/urban-low-chalk">Product</option><option value="/checkout">Checkout</option><option value="/admin">Dashboard</option></select></header><div class="stage"><iframe title="Responsive preview" src="/"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');let w=1440,h=1000;function fit(){const s=Math.min((innerWidth-24)/w,(innerHeight-76)/h,1);frame.width=w;frame.height=h;frame.style.transform=`scale(${s})`;stage.style.width=w*s+'px';stage.style.height=h*s+'px'}function choose(width,height,button){w=width;h=height;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));fit()}window.onresize=fit;fit();</script></html>
